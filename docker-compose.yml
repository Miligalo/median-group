services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: crm_app
    volumes:
      - ./src:/var/www/html
    networks:
      - crm_net

  nginx:
    image: nginx:1.25-alpine
    container_name: crm_nginx
    ports:
      - "8888:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - crm_net

networks:
  crm_net:
    driver: bridge
